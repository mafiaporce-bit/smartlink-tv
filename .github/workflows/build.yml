name: Build APK
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls -t *.zip | head -1)
          echo "Using $ZIP"
          rm -rf project && mkdir project && unzip -q "$ZIP" -d project
          if [ ! -f project/settings.gradle ]; then
            d=$(dirname "$(find project -name settings.gradle | head -1)")
            mv "$d" project_src && rm -rf project && mv project_src project
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk SmartLink-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmartLink-TV
          path: SmartLink-TV.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SmartLink-TV.apk -t "SmartLink TV (latest)" -n "Download SmartLink-TV.apk on your phone and tap Install."
